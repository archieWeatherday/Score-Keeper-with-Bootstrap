<!DOCTYPE html>
<html>
	<head>
		<title> Ping Pong ScoreKeeper </title>
		<link rel="stylesheet" href="app.css">
	</head>
	<body>
		<!-- First the basic things, add the image and buttons and text-->
		<div id="main">
			<img src="photo.avif" id="photo">
			<div id="heading">
				<span> Ping Pong Scorekeeper </span>
			</div>
			<!-- This will be the ping pong interface.-->
			<div id="playPP">
				<h1 id="score"> <span id="player1score">0</span> to <span id="player2score">0</span> </h1>
				<div> Use the buttons below to keep score.</div>
				<label for="scoreNumber"> <b> Playing To </b> </label>
				<select id="scoreNumber">
					
				</select>
				<!-- Now i need to add the buttons..-->
				<div>
					<button id="player1"> +1 Player One </button>
					<button id="player2"> +1 Player Two </button>
					<button id="reset"> Reset </button>
				</div>
			</div>
		</div>

		
	</body>
	<script src="app.js"></script>
</html>
