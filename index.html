<!DOCTYPE html>
<html>
	<head>
		<title> Ping Pong ScoreKeeper </title>
		<link rel="stylesheet" href="app.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
	</head>
	<body>
		<!-- Now to add the bootstrap! First, i want a card...-->
		<!-- First the basic things, add the image and buttons and text-->
		<div class="container">
		<div class = "d-flex justify-content-center">
		<div id="main" class="card">
		   	<img src="photo.avif" id="photo" class="img-fluid">
			<div id="heading col-12">
				<div class="card-header"> Ping Pong Scorekeeper </div>
			</div>

			<!-- This will be the ping pong interface.-->
			<div id="playPP col-12">
				<h1 id="score"> <span id="player1score">0</span> to <span id="player2score">0</span> </h1>
				<div> Use the buttons below to keep score.</div>
				<label for="scoreNumber"> <b> Playing To </b> </label>
				<select id="scoreNumber" class="rounded">					
				</select>
				<!-- Now i need to add the buttons..-->
			</div>
			 <div class="row m-0">
                                        <button id="player1" class="btn btn-lg btn-success col-4"> +1 Player One </button>
                                        <button id="player2" class="btn btn-lg btn-primary col-4 "> +1 Player Two </button>
                                        <button id="reset" class="btn btn-lg  btn-danger col-4"> Reset </button>
                         </div>
		</div>
		</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
	</body>
	<script src="app.js"></script>
</html>
